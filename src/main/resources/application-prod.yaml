spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    defer-datasource-initialization: false
  sql:
    init:
      mode: never

app:
  base-url: ${APP_BASE_URL}
  upload-dir: ${UPLOAD_DIR:/app/uploads}

jwt:
  secret-key: ${JWT_SECRET}
