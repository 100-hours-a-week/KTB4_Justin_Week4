<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="872" viewBox="0 0 1330 872" role="img" aria-labelledby="title desc">
  <title id="title">TuneLog ERD</title>
  <desc id="desc">users, posts, comments, post_likes 테이블과 관계를 나타낸 ERD</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .table-name { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .column { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; }
      .type { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
      .key { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #facc15; }
      .fk { fill: #fda4af; }
      .relation { fill: none; stroke: #fda4af; stroke-width: 2; stroke-dasharray: 7 5; }
      .relation-label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fda4af; }
      .row-line { stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1330" height="872" fill="#17191d"/>
  <text x="52" y="46" class="title">TuneLog Database Schema</text>

  <!-- relationships -->
  <path class="relation" d="M370 225 H520"/>
  <text x="380" y="216" class="relation-label">1</text><text x="500" y="216" class="relation-label">N</text>
  <path class="relation" d="M220 342 V574 H190"/>
  <text x="230" y="362" class="relation-label">1</text><text x="198" y="566" class="relation-label">N</text>
  <path class="relation" d="M370 300 L900 616"/>
  <text x="380" y="300" class="relation-label">1</text><text x="884" y="610" class="relation-label">N</text>
  <path class="relation" d="M700 474 L445 574"/>
  <text x="706" y="492" class="relation-label">1</text><text x="449" y="565" class="relation-label">N</text>
  <path class="relation" d="M850 474 L1008 616"/>
  <text x="855" y="494" class="relation-label">1</text><text x="990" y="610" class="relation-label">N</text>

  <!-- users -->
  <g filter="url(#shadow)">
    <rect x="60" y="90" width="310" height="252" rx="10" fill="#23262c" stroke="#475569"/>
    <path d="M60 100 Q60 90 70 90 H360 Q370 90 370 100 V132 H60Z" fill="#3b2416"/>
    <text x="78" y="117" class="table-name">회원</text><text x="344" y="117" class="type" text-anchor="end">users</text>
    <g transform="translate(78 157)">
      <text class="key">PK</text><text x="35" class="column">id</text><text x="282" class="type" text-anchor="end">BIGINT</text>
      <line x1="-18" y1="17" x2="292" y2="17" class="row-line"/>
      <text y="38" class="column">email</text><text x="282" y="38" class="type" text-anchor="end">VARCHAR(255)</text>
      <line x1="-18" y1="54" x2="292" y2="54" class="row-line"/>
      <text y="75" class="column">password</text><text x="282" y="75" class="type" text-anchor="end">VARCHAR(255)</text>
      <line x1="-18" y1="91" x2="292" y2="91" class="row-line"/>
      <text y="112" class="column">nickname</text><text x="282" y="112" class="type" text-anchor="end">VARCHAR(10)</text>
      <line x1="-18" y1="128" x2="292" y2="128" class="row-line"/>
      <text y="149" class="column">profile_image</text><text x="282" y="149" class="type" text-anchor="end">VARCHAR(500)</text>
    </g>
  </g>

  <!-- posts -->
  <g filter="url(#shadow)">
    <rect x="520" y="72" width="390" height="402" rx="10" fill="#23262c" stroke="#475569"/>
    <path d="M520 82 Q520 72 530 72 H900 Q910 72 910 82 V114 H520Z" fill="#3b2416"/>
    <text x="538" y="99" class="table-name">게시글</text><text x="884" y="99" class="type" text-anchor="end">posts</text>
    <g transform="translate(538 138)">
      <text class="key">PK</text><text x="36" class="column">id</text><text x="346" class="type" text-anchor="end">BIGINT</text>
      <text y="27" class="key fk">FK</text><text x="36" y="27" class="column">user_id</text><text x="346" y="27" class="type" text-anchor="end">BIGINT</text>
      <text y="54" class="column">artist</text><text x="346" y="54" class="type" text-anchor="end">VARCHAR(100)</text>
      <text y="81" class="column">track_title</text><text x="346" y="81" class="type" text-anchor="end">VARCHAR(200)</text>
      <text y="108" class="column">genre</text><text x="346" y="108" class="type" text-anchor="end">VARCHAR(30)</text>
      <text y="135" class="column">content</text><text x="346" y="135" class="type" text-anchor="end">TEXT</text>
      <text y="162" class="column">image_url</text><text x="346" y="162" class="type" text-anchor="end">VARCHAR(1000)</text>
      <text y="189" class="column">view_count</text><text x="346" y="189" class="type" text-anchor="end">BIGINT</text>
      <text y="216" class="column">like_count</text><text x="346" y="216" class="type" text-anchor="end">BIGINT</text>
      <text y="243" class="column">comment_count</text><text x="346" y="243" class="type" text-anchor="end">BIGINT</text>
      <text y="270" class="column">created_at</text><text x="346" y="270" class="type" text-anchor="end">DATETIME(6)</text>
      <text y="297" class="column">updated_at</text><text x="346" y="297" class="type" text-anchor="end">DATETIME(6)</text>
    </g>
  </g>

  <!-- comments -->
  <g filter="url(#shadow)">
    <rect x="110" y="574" width="370" height="232" rx="10" fill="#23262c" stroke="#475569"/>
    <path d="M110 584 Q110 574 120 574 H470 Q480 574 480 584 V616 H110Z" fill="#3b2416"/>
    <text x="128" y="601" class="table-name">댓글</text><text x="454" y="601" class="type" text-anchor="end">comments</text>
    <g transform="translate(128 640)">
      <text class="key">PK</text><text x="36" class="column">id</text><text x="326" class="type" text-anchor="end">BIGINT</text>
      <text y="29" class="key fk">FK</text><text x="36" y="29" class="column">post_id</text><text x="326" y="29" class="type" text-anchor="end">BIGINT</text>
      <text y="58" class="key fk">FK</text><text x="36" y="58" class="column">user_id</text><text x="326" y="58" class="type" text-anchor="end">BIGINT</text>
      <text y="87" class="column">content</text><text x="326" y="87" class="type" text-anchor="end">TEXT</text>
      <text y="116" class="column">created_at</text><text x="326" y="116" class="type" text-anchor="end">DATETIME(6)</text>
      <text y="145" class="column">updated_at</text><text x="326" y="145" class="type" text-anchor="end">DATETIME(6)</text>
    </g>
  </g>

  <!-- post_likes -->
  <g filter="url(#shadow)">
    <rect x="850" y="616" width="370" height="190" rx="10" fill="#23262c" stroke="#475569"/>
    <path d="M850 626 Q850 616 860 616 H1210 Q1220 616 1220 626 V658 H850Z" fill="#3b2416"/>
    <text x="868" y="643" class="table-name">게시글 좋아요</text><text x="1194" y="643" class="type" text-anchor="end">post_likes</text>
    <g transform="translate(868 682)">
      <text class="key">PK</text><text x="36" class="column">id</text><text x="326" class="type" text-anchor="end">BIGINT</text>
      <text y="31" class="key fk">FK</text><text x="36" y="31" class="column">user_id</text><text x="326" y="31" class="type" text-anchor="end">BIGINT</text>
      <text y="62" class="key fk">FK</text><text x="36" y="62" class="column">post_id</text><text x="326" y="62" class="type" text-anchor="end">BIGINT</text>
      <text y="93" class="column">created_at</text><text x="326" y="93" class="type" text-anchor="end">DATETIME(6)</text>
    </g>
  </g>
</svg>
