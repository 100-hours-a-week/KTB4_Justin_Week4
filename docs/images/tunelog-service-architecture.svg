<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">TuneLog 서비스 아키텍처</title>
  <desc id="desc">사용자 요청이 EC2의 Nginx와 React 프론트엔드, Spring Boot 백엔드, RDS MySQL 및 업로드 볼륨으로 흐르는 과정과 GitHub Actions 기반 CI/CD 배포 흐름</desc>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D5AF7"/>
      <stop offset="100%" stop-color="#4D3ED7"/>
    </linearGradient>
    <linearGradient id="ec2Gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F3FF"/>
      <stop offset="100%" stop-color="#EFECFF"/>
    </linearGradient>
    <linearGradient id="deployFlow" gradientUnits="userSpaceOnUse" x1="272" y1="0" x2="1318" y2="0">
      <stop offset="0%" stop-color="#B8B1FA"/>
      <stop offset="35%" stop-color="#9185F8"/>
      <stop offset="70%" stop-color="#6756F2"/>
      <stop offset="100%" stop-color="#4432CE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2D265C" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6251F4"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7A7F91"/>
    </marker>
    <style>
      .text { font-family: Pretendard, Inter, "Noto Sans KR", Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 800; fill: #1D1C27; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #727687; }
      .section { font-size: 21px; font-weight: 800; fill: #34313F; }
      .card-title { font-size: 21px; font-weight: 800; fill: #24222D; }
      .card-subtitle { font-size: 15px; font-weight: 500; fill: #737789; }
      .mini { font-size: 14px; font-weight: 700; fill: #6251F4; }
      .flow { fill: none; stroke: #6251F4; stroke-width: 3; marker-end: url(#arrowPurple); }
      .flow-gray { fill: none; stroke: #7A7F91; stroke-width: 2.5; marker-end: url(#arrowGray); }
      .flow-dashed { fill: none; stroke: #6251F4; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrowPurple); }
      .deploy-flow { fill: none; stroke: url(#deployFlow); stroke-width: 4; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1600" height="960" fill="#FAFAFD"/>
  <rect x="0" y="0" width="1600" height="12" fill="url(#headerGradient)"/>

  <g class="text">
    <text x="70" y="76" class="title">TuneLog 서비스 아키텍처</text>
    <text x="70" y="108" class="subtitle">단일 EC2 · Docker Compose · Amazon RDS · GitHub Actions CI/CD</text>

    <!-- Runtime section -->
    <rect x="50" y="140" width="1500" height="470" rx="28" fill="#FFFFFF" stroke="#E4E5EC" stroke-width="2" filter="url(#shadow)"/>
    <text x="82" y="184" class="section">서비스 요청 흐름</text>

    <!-- Browser -->
    <rect x="82" y="286" width="190" height="132" rx="22" fill="#FFFFFF" stroke="#DADCE7" stroke-width="2"/>
    <circle cx="177" cy="324" r="18" fill="#ECE9FF"/>
    <path d="M164 324h26M177 311c7 7 7 19 0 26M177 311c-7 7-7 19 0 26" fill="none" stroke="#6251F4" stroke-width="2" stroke-linecap="round"/>
    <text x="177" y="368" text-anchor="middle" class="card-title">사용자 브라우저</text>
    <text x="177" y="393" text-anchor="middle" class="card-subtitle">웹 서비스 접속</text>

    <!-- EC2 boundary -->
    <rect x="340" y="212" width="850" height="342" rx="28" fill="url(#ec2Gradient)" stroke="#A99FFF" stroke-width="2"/>
    <rect x="366" y="230" width="164" height="36" rx="18" fill="#6251F4"/>
    <text x="448" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">AWS EC2 · t3.micro</text>
    <text x="1148" y="253" text-anchor="end" class="card-subtitle">Docker Compose</text>

    <!-- Frontend container -->
    <rect x="392" y="292" width="310" height="164" rx="22" fill="#FFFFFF" stroke="#D8D3FF" stroke-width="2" filter="url(#shadow)"/>
    <rect x="414" y="312" width="74" height="28" rx="14" fill="#EEEAFE"/>
    <text x="451" y="331" text-anchor="middle" class="mini">PORT 80</text>
    <text x="547" y="375" text-anchor="middle" class="card-title">Frontend 컨테이너</text>
    <text x="547" y="404" text-anchor="middle" class="card-subtitle">Nginx + React 정적 빌드</text>
    <text x="547" y="430" text-anchor="middle" class="card-subtitle">정적 파일 제공 · Reverse Proxy</text>

    <!-- Backend container -->
    <rect x="760" y="292" width="350" height="164" rx="22" fill="#FFFFFF" stroke="#D8D3FF" stroke-width="2" filter="url(#shadow)"/>
    <rect x="782" y="312" width="116" height="28" rx="14" fill="#EEEAFE"/>
    <text x="840" y="331" text-anchor="middle" class="mini">INTERNAL 8080</text>
    <text x="935" y="375" text-anchor="middle" class="card-title">Backend 컨테이너</text>
    <text x="935" y="404" text-anchor="middle" class="card-subtitle">Spring Boot · Java 21</text>
    <text x="935" y="430" text-anchor="middle" class="card-subtitle">인증 · 비즈니스 로직 · 데이터 접근</text>

    <!-- Upload volume -->
    <rect x="760" y="478" width="350" height="52" rx="16" fill="#FFFFFF" stroke="#D8D3FF" stroke-width="2"/>
    <text x="782" y="510" class="card-subtitle">EC2 uploads 디렉터리</text>
    <text x="1088" y="510" text-anchor="end" class="mini">Bind Mount</text>

    <!-- RDS -->
    <rect x="1272" y="286" width="226" height="132" rx="22" fill="#FFFFFF" stroke="#B9D9CB" stroke-width="2" filter="url(#shadow)"/>
    <ellipse cx="1385" cy="320" rx="26" ry="10" fill="#DDF3E9" stroke="#26976A" stroke-width="2"/>
    <path d="M1359 320v24c0 6 12 10 26 10s26-4 26-10v-24" fill="#DDF3E9" stroke="#26976A" stroke-width="2"/>
    <text x="1385" y="384" text-anchor="middle" class="card-title">Amazon RDS</text>
    <text x="1385" y="407" text-anchor="middle" class="card-subtitle">MySQL 8 · Private Access</text>

    <!-- Runtime arrows -->
    <path d="M272 352H378" class="flow"/>
    <rect x="283" y="320" width="86" height="24" rx="12" fill="#FFFFFF"/>
    <text x="326" y="337" text-anchor="middle" class="mini">HTTP :80</text>

    <path d="M702 374H746" class="flow"/>
    <rect x="695" y="337" width="78" height="24" rx="12" fill="#F4F1FF"/>
    <text x="734" y="354" text-anchor="middle" class="mini">/api/*</text>

    <path d="M1110 374H1258" class="flow"/>
    <rect x="1135" y="337" width="100" height="24" rx="12" fill="#FFFFFF"/>
    <text x="1185" y="354" text-anchor="middle" class="mini">JDBC 3306</text>

    <path d="M935 456V466" class="flow-gray"/>
    <text x="954" y="471" class="card-subtitle">/uploads/*</text>

    <!-- CI/CD section -->
    <rect x="50" y="638" width="1500" height="270" rx="28" fill="#FFFFFF" stroke="#E4E5EC" stroke-width="2" filter="url(#shadow)"/>
    <text x="82" y="682" class="section">CI/CD 배포 흐름</text>

    <!-- CI cards -->
    <g>
      <rect x="82" y="730" width="190" height="112" rx="20" fill="#FAF9FF" stroke="#D9D4FF" stroke-width="2"/>
      <circle cx="104" cy="730" r="15" fill="#B8B1FA"/>
      <text x="104" y="735" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">1</text>
      <text x="177" y="778" text-anchor="middle" class="card-title">개발자</text>
      <text x="177" y="807" text-anchor="middle" class="card-subtitle">main 브랜치 Push</text>

      <rect x="322" y="730" width="190" height="112" rx="20" fill="#F5F2FF" stroke="#C8C1FF" stroke-width="2"/>
      <circle cx="344" cy="730" r="15" fill="#A298FA"/>
      <text x="344" y="735" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">2</text>
      <text x="417" y="778" text-anchor="middle" class="card-title">GitHub 저장소</text>
      <text x="417" y="807" text-anchor="middle" class="card-subtitle">Frontend · Backend</text>

      <rect x="562" y="730" width="220" height="112" rx="20" fill="#EEEAFE" stroke="#ADA4FF" stroke-width="2"/>
      <circle cx="584" cy="730" r="15" fill="#887BF7"/>
      <text x="584" y="735" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">3</text>
      <text x="672" y="770" text-anchor="middle" class="card-title">GitHub Actions</text>
      <text x="672" y="799" text-anchor="middle" class="card-subtitle">Hosted Runner · Buildx</text>
      <text x="672" y="824" text-anchor="middle" class="card-subtitle">멀티스테이지 이미지 빌드</text>

      <rect x="832" y="730" width="190" height="112" rx="20" fill="#E6E1FF" stroke="#9589FA" stroke-width="2"/>
      <circle cx="854" cy="730" r="15" fill="#7060F3"/>
      <text x="854" y="735" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">4</text>
      <text x="927" y="778" text-anchor="middle" class="card-title">GHCR</text>
      <text x="927" y="807" text-anchor="middle" class="card-subtitle">Container Registry</text>

      <rect x="1072" y="730" width="210" height="112" rx="20" fill="#DDD6FF" stroke="#7869F5" stroke-width="2"/>
      <circle cx="1094" cy="730" r="15" fill="#5948E4"/>
      <text x="1094" y="735" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">5</text>
      <text x="1177" y="770" text-anchor="middle" class="card-title">EC2 Runner</text>
      <text x="1177" y="799" text-anchor="middle" class="card-subtitle">Self-hosted Runner</text>
      <text x="1177" y="824" text-anchor="middle" class="card-subtitle">새 이미지 Pull</text>

      <rect x="1332" y="730" width="166" height="112" rx="20" fill="#6251F4"/>
      <circle cx="1354" cy="730" r="15" fill="#3F2DCB"/>
      <text x="1354" y="735" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">6</text>
      <text x="1415" y="778" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">Compose</text>
      <text x="1415" y="807" text-anchor="middle" font-size="15" font-weight="600" fill="#E9E6FF">컨테이너 교체</text>
    </g>

    <path d="M272 786H308" class="deploy-flow"/>
    <path d="M512 786H548" class="deploy-flow"/>
    <path d="M782 786H818" class="deploy-flow"/>
    <path d="M1022 786H1058" class="deploy-flow"/>
    <path d="M1282 786H1318" class="deploy-flow"/>

    <path d="M1415 730V650C1415 624 1395 600 1364 584H1110" class="flow-dashed"/>
    <rect x="1194" y="570" width="148" height="28" rx="14" fill="#F3F0FF"/>
    <text x="1268" y="589" text-anchor="middle" class="mini">자동 배포 · 재시작</text>
  </g>
</svg>
