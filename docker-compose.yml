services:
  backend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/tunelog-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      UPLOAD_DIR: /app/uploads
    volumes:
      - /home/ubuntu/tunelog/uploads:/app/uploads
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/tunelog-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
