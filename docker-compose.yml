services:
  backend:
    image: ghcr.io/100-hours-a-week/tunelog-backend:${BACKEND_IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      UPLOAD_DIR: /app/uploads
    volumes:
      - /home/ubuntu/tunelog/uploads:/app/uploads
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    image: ghcr.io/100-hours-a-week/tunelog-frontend:${FRONTEND_IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
