services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      UPLOAD_DIR: /app/uploads
    volumes:
      - /home/ubuntu/tunelog/uploads:/app/uploads
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

